mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

config:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

  exporters:
    influxdb:
      endpoint: http://influxdb:80
      org: lab-org
      bucket: leads
      token: local-lab-token-change-me
      metrics_schema: telegraf-prometheus-v1

  service:
    pipelines:
      metrics:
        receivers: [otlp]
        exporters: [debug, influxdb]